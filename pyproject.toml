[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safetyvision-mlops"
version = "2.0.0"
description = "Production MLOps platform for industrial computer-vision safety detection"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "prometheus-client>=0.20,<1",
  "mlflow>=2.17,<4",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
