services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SAFETYVISION_WEIGHTS: /models/model.ts
    volumes:
      - ./artifacts:/models:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
